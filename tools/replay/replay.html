<!doctype html>
<meta charset="utf-8">
<title>影片重播：深蹲判定</title>
<!--
  開發工具：把錄好的影片（ffmpeg 抽成影格）逐格餵進「系統自己的」MediaPipe 模型＋深蹲判定引擎，
  記下每一幀的深度訊號、取景結果與計次，用來找實機計次不準的原因。
  用法：在專案根目錄開本機伺服器（python3 -m http.server 8099），開
    http://localhost:8099/tools/replay/replay.html?dir=frames/s1&fps=15
  影格放在 tools/replay/frames/<名稱>/f00001.jpg…（已加入 .gitignore）。
  結果放在 window.__replay（每幀一列），完成時 window.__replayDone = true。
-->
<pre id="log">載入中…</pre>
<script type="module">
import { createPose } from '../../app/core/pose.js';
import { createDetector } from '../../app/core/engine.js';
import { squat } from '../../app/core/exercises/squat.js';
import { framingReport } from '../../app/core/framing.js';

const q = new URLSearchParams(location.search);
const dir = q.get('dir') || 'frames/s1';
const fps = Number(q.get('fps') || 15);
const from = Number(q.get('from') || 1);
const to = Number(q.get('to') || 999999);
const log = (t) => { document.getElementById('log').textContent = t; };

// 包裝 evaluate：用引擎當下實際算出的 s（腿長、站立基準、hipDrop）取值，不另寫一套量測（踩雷筆記雷 5）
let cap = null;
const spec = {
  ...squat,
  evaluate(f, s) {
    const r = squat.evaluate(f, s);
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const hip = mid(f[23], f[24]), knee = mid(f[25], f[26]);
    cap = { hipY: hip.y, kneeY: knee.y, legLength: s.legLength, hipDrop: s.hipDrop ?? null,
            progress: r.progress, gatePass: r.gatePass, faults: (r.faults || []).map(x => x.id || x.code || x) };
    return r;
  },
};

const pose = await createPose({ model: 'full', assetRoot: '../../vendor' });
const det = createDetector(spec);
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
canvas.readyState = 4;   // pose.detect 會檢查 video.readyState；canvas 本身沒有這個屬性
const rows = [];
let prevValid = 0, prevInvalid = 0;

for (let i = from; i <= to; i++) {
  const img = new Image();
  img.src = `${dir}/f${String(i).padStart(5, '0')}.jpg`;
  try { await img.decode(); } catch { break; }
  if (canvas.width !== img.naturalWidth) { canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; }
  ctx.drawImage(img, 0, 0);
  const tMs = Math.round((i - 1) * 1000 / fps);
  cap = null;
  const lm = pose.detect(canvas, tMs + 1);
  const row = { i, t: +(tMs / 1000).toFixed(2), seen: !!lm };
  if (lm) {
    // 跟引擎同一組取景條件（深蹲的 gateLandmarks、visMin 0.4），才能看出引擎為什麼判「看不到」
    const rep = framingReport(lm, { gateLandmarks: squat.gateLandmarks, visMin: 0.4, requireHead: squat.requireHead !== false });
    row.framing = rep.ok ? 'ok' : (rep.reason || rep.code || 'bad');
    row.gateVis = squat.gateLandmarks.map(k => +(lm[k].visibility ?? 0).toFixed(2));
    const res = det.update(lm, tMs);
    row.phase = res.phase; row.visible = res.visible; row.signal = +(res.signal ?? 0).toFixed(3);
    row.counted = !!res.repCountedThisFrame;
    if (cap) Object.assign(row, {
      depth: +((cap.hipY - cap.kneeY) / cap.legLength).toFixed(3),
      drop: cap.hipDrop === null ? null : +cap.hipDrop.toFixed(3),
      gate: cap.gatePass, faults: cap.faults.join(','),
      ankleY: +(((lm[27].y + lm[28].y) / 2)).toFixed(3), ankleVis: +(((lm[27].visibility + lm[28].visibility) / 2)).toFixed(2),
    });
    const s = det.summary();
    if (s.validReps !== prevValid) { row.valid = s.validReps; prevValid = s.validReps; }
    if (s.invalidReps !== prevInvalid) { row.invalid = s.invalidReps; row.why = JSON.stringify(s.faultCounts || {}); prevInvalid = s.invalidReps; }
  }
  rows.push(row);
  if (i % 100 === 0) log(`${i} 幀，有效 ${prevValid}／無效 ${prevInvalid}`);
}
window.__replay = rows;
window.__summary = det.summary();
window.__replayDone = true;
log(`完成 ${rows.length} 幀，有效 ${prevValid}／無效 ${prevInvalid}`);
</script>
