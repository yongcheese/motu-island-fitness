<!doctype html>
<meta charset="utf-8">
<title>錄影：深蹲判定用</title>
<!--
  開發工具：錄下鏡頭「原生、完整、不裁切」的畫面（優先要原生橫向 4:3），
  之後用 ffmpeg 抽影格交給 replay.html 逐格分析。錄的是鏡頭畫面本身，沒有骨架、字卡疊在上面。
  刻意不用系統的 startCamera：系統目前的請求在部分筆電上會被瀏覽器裁掉約 25%（見 docs/verification/深蹲站立基準修正.md 前的 10-16 量測），
  錄完整畫面才能事後同時模擬「系統裁切後」與「完整畫面」兩種情況。拿不到原生 4:3 時退回鏡頭預設。
  用法：在專案根目錄開本機伺服器（python3 -m http.server 8099），開
    http://localhost:8099/tools/replay/record.html
  按「開始錄影」→ 倒數 5 秒 → 錄到按「停止」為止，結束後自動下載 .webm。
-->
<style>
  body { margin: 0; font: 18px/1.5 -apple-system, "PingFang TC", sans-serif; background: #0F2A44; color: #fff; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 10px; border: 0; cursor: pointer; }
  #go { background: #2A9D8F; color: #fff; } #stop { background: #E76F51; color: #fff; }
  #info { opacity: .8; }
  #wrap { position: relative; height: calc(100vh - 64px); }
  video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); background: #000; }
  #cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 160px; font-weight: 900; pointer-events: none; }
</style>
<div id="bar">
  <button id="go">開始錄影</button><button id="stop" disabled>停止</button>
  <span id="info">啟動鏡頭中…</span>
</div>
<div id="wrap"><video id="v" muted playsinline></video><div id="cd"></div></div>
<script type="module">
const info = document.getElementById('info'), cd = document.getElementById('cd');
const go = document.getElementById('go'), stop = document.getElementById('stop');
let stream;
try {
  stream = await navigator.mediaDevices.getUserMedia({ audio: false,
    video: { width: { ideal: 1920 }, aspectRatio: { min: 1.3, max: 1.37 }, resizeMode: { exact: 'none' }, facingMode: 'user' } });
} catch {
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { width: { ideal: 1920 }, resizeMode: 'none', facingMode: 'user' } });
}
const vEl = document.getElementById('v');
vEl.srcObject = stream; await vEl.play();
const cam = { stream, video: vEl };
const st = stream.getVideoTracks()[0].getSettings();
info.textContent = `鏡頭 ${st.width}×${st.height}（${st.resizeMode === 'none' ? '原生、未裁切' : '瀏覽器裁切：' + st.resizeMode}）`;

let rec = null, chunks = [], t0 = 0, timer = null;
go.onclick = async () => {
  go.disabled = true;
  for (let s = 5; s > 0; s--) { cd.textContent = s; await new Promise(r => setTimeout(r, 1000)); }
  cd.textContent = '';
  chunks = [];
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  rec = new MediaRecorder(cam.stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = `squat-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.webm`;
    a.click();
    info.textContent = '已下載，可以再錄一段';
    go.disabled = false;
  };
  rec.start(1000);
  t0 = Date.now(); stop.disabled = false;
  timer = setInterval(() => { info.textContent = `錄影中 ${Math.round((Date.now() - t0) / 1000)} 秒`; }, 500);
};
stop.onclick = () => { clearInterval(timer); stop.disabled = true; rec?.stop(); };
</script>
