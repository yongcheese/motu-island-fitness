<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#F8F6F1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏝️%3C/text%3E%3C/svg%3E" />
  <title>Island Fitness AI · AI 健身辨識與島嶼建設連動系統</title>
  <link rel="stylesheet" href="./app/styles/app.css" />
  <link rel="stylesheet" href="./app/features/workout/workout.css" />
  <link rel="stylesheet" href="./app/features/island/island.css" />
  <link rel="stylesheet" href="./app/features/tracking/tracking.css" />
  <link rel="stylesheet" href="./app/features/settings/settings.css" />
  <link rel="stylesheet" href="./app/features/today/today.css" />
  <link rel="stylesheet" href="./app/styles/lumina.css" />
  <link rel="stylesheet" href="./app/styles/motu.css" />
  <!-- 外殼樣式排在 motu-skin 之前：motu-skin 必須最後載入（tests/motu-skin.test.js），
       外殼全用 sh-* 新 class，不會被 motu-skin 的舊 .tabbar/.tab 規則影響 -->
  <link rel="stylesheet" href="./app/styles/shell.css" />
  <link rel="stylesheet" href="./app/styles/motu-skin.css" />
  <script src="./vendor/lib/chart.umd.min.js" defer></script>
</head>
<body>
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-logo">🏝️</div>
      <div class="loader-title">Island Fitness AI</div>
      <div class="loader-sub">AI 健身辨識與島嶼建設連動系統</div>
      <div class="loader-bar"><i></i></div>
    </div>
  </div>

  <div id="app">
    <main id="view"></main>
    <!-- 外殼（遊戲端主頁樣式）：全螢幕訓練時整個 #shell 一次隱藏 -->
    <div id="shell">
      <div class="sh-account" id="sh-account"></div>
      <div class="sh-rail" id="sh-rail"></div>
      <div class="sh-corner" id="sh-corner"></div>
      <nav class="sh-tabs" id="sh-tabs" aria-label="主要分頁"></nav>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="./app/main.js"></script>
</body>
</html>
