<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Wall icon preview</title>
    <style>html, body { margin: 0; background: #f6f3ec; }</style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="err" style="color:#b91c1c;font:12px monospace"></pre>
    <script>
      const show = (m) => { document.getElementById('err').textContent += m + '\n'; };
      window.addEventListener('error', (e) => show('ERROR: ' + (e.message || e.error)));
      window.addEventListener('unhandledrejection', (e) => show('REJECT: ' + e.reason));
    </script>
    <script type="module" src="/tmp-wall-icons.tsx"></script>
  </body>
</html>
