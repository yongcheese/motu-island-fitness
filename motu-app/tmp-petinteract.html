<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Pet interaction preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #eef2f5; }
      #root { width: 100vw; height: 100vh; }
      .bar { position: fixed; z-index: 9; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center;
             padding: 8px 12px; background: rgba(15,23,32,.85); color: #e2e8f0; font: 13px system-ui; }
      .bar button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #3f6f6a;
                    background: #24424a; color: #dff0ff; cursor: pointer; }
      pre { position: fixed; bottom: 0; left: 0; color: #b91c1c; font: 12px monospace; z-index: 9; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="err"></pre>
    <script>
      const show = (m) => { document.getElementById('err').textContent += m + '\n'; };
      window.addEventListener('error', (e) => show('ERROR: ' + (e.message || e.error) + ' @ ' + e.filename));
      window.addEventListener('unhandledrejection', (e) => show('REJECT: ' + e.reason));
    </script>
    <script type="module" src="/tmp-petinteract.tsx"></script>
  </body>
</html>
