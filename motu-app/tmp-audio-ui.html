<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Audio settings panel</title>
    <link rel="stylesheet" href="/src/index.css" />
    <style> body { margin: 0; } </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="err" style="position:fixed;top:0;left:0;color:#b91c1c;font:12px monospace;z-index:9"></pre>
    <script>
      const show = (m) => { document.getElementById('err').textContent += m + '\n'; };
      window.addEventListener('error', (e) => show('ERROR: ' + (e.message || e.error)));
      window.addEventListener('unhandledrejection', (e) => show('REJECT: ' + e.reason));
    </script>
    <script type="module" src="/tmp-audio-ui.tsx"></script>
  </body>
</html>
