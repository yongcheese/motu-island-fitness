<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Wardrobe preview</title>
    <style>
      body { margin: 0; padding: 16px; background: #eef1f5; font-family: system-ui, sans-serif; }
      h2 { font-size: 15px; color: #33475b; margin: 18px 0 6px; }
      .strip { width: 1500px; height: 330px; }
      .strip.tall { height: 400px; }
      .labels { width: 1500px; display: flex; margin-bottom: 6px; }
      .labels span { flex: 1; text-align: center; font-size: 13px; color: #33475b; }
      code { font-size: 11px; color: #7b8c9e; }
      pre { color: #b00020; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="err"></pre>
    <script>
      const show = (m) => { document.getElementById('err').textContent += m + '\n'; };
      window.addEventListener('error', (e) => show('ERROR: ' + (e.message || e.error) + ' @ ' + e.filename));
      window.addEventListener('unhandledrejection', (e) => show('REJECT: ' + e.reason));
    </script>
    <script type="module" src="/tmp-shoes-preview.tsx"></script>
  </body>
</html>
