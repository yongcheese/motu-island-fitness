<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>NPC social preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #eef2f5; }
      #root { width: 100vw; height: 100vh; }
      .hud { position: fixed; z-index: 9; top: 0; left: 0; right: 0; padding: 8px 12px; background: rgba(15,23,32,.85);
             color: #e2e8f0; font: 13px system-ui; display: flex; gap: 14px; }
      pre { position: fixed; bottom: 0; left: 0; color: #b91c1c; font: 12px monospace; z-index: 9; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="err"></pre>
    <script>
      const show = (m) => { document.getElementById('err').textContent += m + '\n'; };
      window.addEventListener('error', (e) => show('ERROR: ' + (e.message || e.error) + ' @ ' + e.filename));
      window.addEventListener('unhandledrejection', (e) => show('REJECT: ' + e.reason));
    </script>
    <script type="module" src="/tmp-npcsocial.tsx"></script>
  </body>
</html>
