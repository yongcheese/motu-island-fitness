<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Audio gate audit</title>
    <style>
      body { margin: 0; font: 13px/1.5 ui-monospace, monospace; background: #101820; color: #d8e6e0; padding: 16px; }
      .fail { color: #f87171; } .pass { color: #4ade80; }
    </style>
  </head>
  <body>
    <pre id="log">booting…</pre>
    <script>
      window.addEventListener('error', (e) => { document.getElementById('log').textContent += '\nERROR: ' + (e.message || e.error); });
      window.addEventListener('unhandledrejection', (e) => { document.getElementById('log').textContent += '\nREJECT: ' + e.reason; });
    </script>
    <script type="module" src="/tmp-audio-audit.tsx"></script>
  </body>
</html>
